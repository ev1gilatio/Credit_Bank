version: "3.9"

x-def-logging: &default-logging
  logging:
    driver: "loki"
    options:
      loki-url: "http://localhost:3100/loki/api/v1/push"
      loki-batch-size: "100"
      loki-retries: 2
      loki-max-backoff: 1000ms
      loki-timeout: 1s

services:
  database:
    image: postgres:14.12-alpine3.20
    restart: on-failure
    environment:
      POSTGRES_USER: evig
      POSTGRES_PASSWORD: evig123
      POSTGRES_DB: credit_bank_db
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "9092:2182"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:2182
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  calculator-service:
    image: evigilatio/calc-service-image
    <<: *default-logging
    ports:
      - "8080:8080"

  deal-service:
    image: evigilatio/deal-service-image
    <<: *default-logging
    ports:
      - "8081:8081"
    environment:
      DB_USER: evig
      DB_PASSWORD: evig123
      DB_URL: jdbc:postgresql://host.docker.internal:5432/credit_bank_db

  statement-service:
    image: evigilatio/statement-service-image
    <<: *default-logging
    ports:
      - "8082:8082"

  dossier-service:
    image: evigilatio/dossier-service-image
    <<: *default-logging
    ports:
      - "8083:8083"
    environment:
      EMAIL: samarin.vladimir163@gmail.com
      EMAIL_PASSWORD: ---

  gateway-service:
    image: evigilatio/gateway-service-image
    <<: *default-logging
    ports:
      - "8084:8084"

  loki:
    hostname: loki
    image: grafana/loki:2.9.0
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./loki/retention-config.yaml:/etc/loki/retention-config.yaml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/retention-config.yaml

  grafana:
    hostname: grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - TZ=${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    image: grafana/grafana:latest
    ports:
      - "3000:3000"